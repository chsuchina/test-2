<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>頁面標題 · 巴勒斯坦問題</title>

    <link rel="stylesheet" href="site-menu.css">
    <link rel="stylesheet" href="back-to-top.css">

    <style>
        :root {
            --page-bg: #c0c0c0;
            --card-bg: #d1d1d1;
            --panel-bg: #ebebeb;
            --border-soft: #dcdcdc;
            --text-main: #2c3e50;
            --text-soft: #5b6f82;
            --brand: #1e3a5f;
            --brand-hover: #2b4b73;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background: var(--page-bg);
            color: var(--text-main);
            line-height: 1.95;
            padding: 0 16px 40px;
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 32px 28px 40px;
            margin-top: 24px;
        }

        h1 {
            font-size: 1.75rem;
            color: var(--brand);
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .sub {
            text-align: center;
            color: var(--text-soft);
            font-size: 0.9rem;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 16px;
        }

        .content p {
            font-size: 0.98rem;
            color: var(--text-main);
            margin-bottom: 16px;
            text-align: justify;
            line-height: 1.95;
        }

        .content p:last-child { margin-bottom: 0; }

        /* 引言框 */
        .quote {
            background: var(--panel-bg);
            border-left: 5px solid var(--brand);
            padding: 16px 22px;
            border-radius: 12px;
            font-size: 1rem;
            color: #3a4a5a;
            margin: 20px 0;
            line-height: 1.9;
            font-style: italic;
        }

        /* 強調 */
        .content strong { font-weight: 700; color: var(--brand); }
        .content em { font-style: italic; }

        /* 連結樣式 */
        .content a {
            color: var(--brand);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s;
            font-weight: 500;
        }

        .content a:hover {
            color: var(--brand-hover);
            text-decoration-thickness: 2px;
        }

        /* 小標題 */
        .content h2 {
            font-size: 1.15rem;
            color: var(--brand);
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--border-soft);
            line-height: 1.5;
        }

        /* 出處 */
        .source-line {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid var(--border-soft);
            font-size: 0.88rem;
            color: var(--text-soft);
            line-height: 1.8;
        }

        .footer-note {
            text-align: center;
            margin-top: 32px;
            font-size: 0.82rem;
            color: #8a9aa8;
            border-top: 1px solid var(--border-soft);
            padding-top: 18px;
        }

        @media (max-width: 600px) {
            .wrap { padding: 20px 16px 28px; border-radius: 18px; }
            h1 { font-size: 1.3rem; letter-spacing: 0; }
            .content p { font-size: 0.93rem; }
            .quote { font-size: 0.95rem; padding: 14px 16px; }
            .content h2 { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>頁面標題</h1>
        <div class="sub">巴勒斯坦問題 · 副標題</div>

        <div class="content">

            <!-- ===== 以下為文字內容區，請自行填入 ===== -->

            <p>第一段文字……</p>

            <p>第二段文字……</p>

            <!-- 若需小標題，用 <h2>：
            <h2>小標題</h2>
            -->

            <!-- 若需引言框，用 <div class="quote">：
            <div class="quote">
                引言文字……
            </div>
            -->

            <!-- 若需外部連結，用 <a href="..." target="_blank" rel="noopener">連結文字</a> -->
            <!-- 若需內部連結，用 <a href="另一頁.html" target="_blank" rel="noopener">連結文字</a> -->
            <!-- 若需粗體，用 <strong>粗體文字</strong> -->
            <!-- 若需斜體，用 <em>斜體文字</em> -->

            <!-- ===== 文字內容區結束 ===== -->

        </div>

        <div class="footer-note">
            Copyright 版權所有©2026 CHSU 巴勒斯坦問題資訊站 · 頁面名稱
        </div>
    </div>

    <script src="site-menu.js"></script>
    <script src="back-to-top.js"></script>
</body>
</html>
